name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  run_go_tests:
    name: "Go: Tests"
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      DD_SERVICE: istio-test
      DD_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.27"

      - name: Configure Datadog Test Optimization
        if: env.DD_API_KEY != ''
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: go
          api_key: ${{ env.DD_API_KEY }}
          site: datadoghq.com

      - name: Run tests
        run: |
          echo '```go' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          if go test ./... | tee -a "$GITHUB_STEP_SUMMARY"; then
            status=0
          else
            status=$?
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  build_and_push:
    name: "Production Registry: us-docker.pkg.dev"
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/build-and-push.yml@873e5eb069348e446ddc20c9c96661073d4bec42 # v0.3.5
    if: github.actor != 'dependabot[bot]'
    needs: run_go_tests
    with:
      cache_from: type=registry,ref=us-docker.pkg.dev/pt-corpus-tf16-prod/pt-pneuma-standard/istio-test:latest
      cache_to: type=inline
      build_args: |
        DD_GIT_REPOSITORY_URL=https://github.com/${{ github.repository }}
        DD_GIT_COMMIT_SHA=${{ github.sha }}
        VERSION=${{ github.event.release.tag_name }}
      registry: us-docker.pkg.dev
      service_account: pt-pneuma-github@pt-corpus-tf16-prod.iam.gserviceaccount.com
      tags: |
        us-docker.pkg.dev/pt-corpus-tf16-prod/pt-pneuma-standard/istio-test:${{ github.event.release.tag_name }}
        us-docker.pkg.dev/pt-corpus-tf16-prod/pt-pneuma-standard/istio-test:latest
      workload_identity_provider: projects/557265520053/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
